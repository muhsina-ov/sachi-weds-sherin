      /* Floating Background Music Controller */
      .music-toggle-btn {
        position: fixed;
        bottom: 22px;
        right: 22px;
        z-index: 60;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(254, 252, 247, 0.92);
        border: 1.5px solid rgba(197, 160, 89, 0.85);
        color: #8c6d23;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2), 0 0 12px rgba(212, 175, 55, 0.35);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        padding: 0;
      }
      .music-toggle-btn:hover {
        transform: scale(1.08);
        border-color: #d4af37;
        color: #5c430e;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.25), 0 0 16px rgba(212, 175, 55, 0.6);
      }
      .music-toggle-btn.playing {
        animation: music-disc-spin 8s linear infinite;
      }
      @keyframes music-disc-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .music-toggle-btn.playing:hover {
        animation-play-state: paused;
        transform: scale(1.08);
      }
      .music-icon {
        width: 20px;
        height: 20px;
      }
      .music-icon.hidden {
        display: none !important;
      }

  <body>
    <div id="root"></div>

    <!-- Background Music Audio & Floating Toggle Button -->
    <audio id="wedding-bg-music" src="./assets/bg-music.mp3" loop preload="auto"></audio>
    <button id="music-toggle-btn" class="music-toggle-btn" aria-label="Toggle background music" title="Toggle background music">
      <svg id="music-icon-playing" class="music-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
      <svg id="music-icon-paused" class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <script>
      (function() {
        const audio = document.getElementById('wedding-bg-music');
        const btn = document.getElementById('music-toggle-btn');
        const iconPlaying = document.getElementById('music-icon-playing');
        const iconPaused = document.getElementById('music-icon-paused');
        let isUserPaused = false;

        function updateUI(playing) {
          if (!btn) return;
          if (playing) {
            btn.classList.add('playing');
            iconPlaying.classList.remove('hidden');
            iconPaused.classList.add('hidden');
          } else {
            btn.classList.remove('playing');
            iconPlaying.classList.add('hidden');
            iconPaused.classList.remove('hidden');
          }
        }

        function tryPlay() {
          if (!audio || !audio.paused || isUserPaused) return;
          const promise = audio.play();
          if (promise !== undefined) {
            promise.then(() => updateUI(true)).catch(() => updateUI(false));
          }
        }

        if (btn && audio) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (audio.paused) {
              isUserPaused = false;
              audio.play().then(() => updateUI(true)).catch(() => {});
            } else {
              isUserPaused = true;
              audio.pause();
              updateUI(false);
            }
          });

          audio.addEventListener('play', () => updateUI(true));
          audio.addEventListener('pause', () => updateUI(false));

          // Auto-start on any initial interaction (gate click, touch, pointer)
          ['click', 'touchstart', 'pointerdown'].forEach(type => {
            window.addEventListener(type, function onFirstAction(e) {
              if (e.target && e.target.closest('#music-toggle-btn')) return;
              tryPlay();
            }, { passive: true });
          });
        }
      })();
    </script>
